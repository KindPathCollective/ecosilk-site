<script>
(function(){ const g=document.getElementById("groups"); const q=document.getElementById("stockSearch");
 function render(){ const s=(q.value||"").toLowerCase(); let any=false;
  g.innerHTML=Object.entries(window.STOCKISTS).map(([state,list])=>{ const items=list.filter(([town,shop])=>!s||(town+" "+shop+" "+state).toLowerCase().includes(s)); if(!items.length) return ""; any=true;

 q.addEventListener("input",render); render(); })();
